server {
    listen 80;
    server_name _;

    # NPM already logs requests in front of this container; keep no second copy here.
    access_log off;
    # Relative redirects (e.g. /app -> /app/), so the https scheme from the proxy is kept.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # COOP + COEP make the page cross-origin isolated: required for WebAssembly threads.
    # nginx drops inherited add_header lines in any location that sets its own, hence the repetition.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Build output with content hashes in the file names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ONNX Runtime binaries (replaced on each deploy, so revalidate).
    location /ort/ {
        types {
            application/javascript mjs;
            application/wasm wasm;
        }
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Model catalogue: always revalidate.
    location = /models/manifest.json {
        alias /usr/share/nginx/models/manifest.json;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Model weights: requested as <file>?v=<sha256 prefix>, so they can be cached forever.
    location /models/ {
        alias /usr/share/nginx/models/;
        types {
            application/octet-stream onnx;
        }
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}
